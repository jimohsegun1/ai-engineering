services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: ai_engineer_neo4j
    ports:
      - "7474:7474" # Neo4j Browser Web UI (http://localhost:7474)
      - "7687:7687" # Bolt Binary Protocol
    environment:
      - NEO4J_AUTH=neo4j/aiengineering_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
